
services:
  postgres:
    image: postgres:15
    container_name: postgres_nadiin
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "22128:5432"
    volumes:
      - postgres_nadiin_data:/var/lib/postgresql/data
    networks:
      - uts_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_nadiin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "44128:80"
    volumes:
      - pgadmin_nadiin_data:/var/lib/pgadmin
    networks:
      - uts_network
    depends_on:
      - postgres

networks:
  uts_network:
    driver: bridge

volumes:
  postgres_nadiin_data:
  pgadmin_nadiin_data:
